<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>水喝千束 — 首次直播预告</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#071033;
      --card:#0b1220cc;
      --accent1:#7c3aed;
      --accent2:#06b6d4;
      --glass: rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(6,182,212,0.08), transparent),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .card{
      width:100%;
      max-width:780px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:18px;
      padding:36px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      backdrop-filter: blur(8px) saturate(120%);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .brand{display:flex;align-items:center;gap:16px;margin-bottom:8px}
    .logo{
      width:62px;height:62px;border-radius:12px;
      background: linear-gradient(135deg,var(--accent1),var(--accent2));
      display:grid;place-items:center;font-weight:800;font-size:20px;color:white;box-shadow:0 6px 18px rgba(12,10,40,0.5)
    }
    h1{margin:0;font-size:18px;font-weight:700}
    p.lead{margin:18px 0 28px 0;font-size:15px;opacity:0.95}
    .block{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));border:1px solid rgba(255,255,255,0.02)}
    .left{flex:1}
    .title{font-size:16px;font-weight:600;margin:0}
    .subtitle{font-size:13px;color:rgba(230,238,248,0.75);margin-top:6px}
    .actions{display:flex;gap:12px}
    .btn{
      display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;font-weight:700;border:0;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease;
      text-decoration:none;color:inherit;background:linear-gradient(90deg,var(--accent1),var(--accent2));box-shadow:0 6px 18px rgba(12,10,40,0.46);
    }
    .btn:active{transform:translateY(1px)}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);box-shadow:none;padding:10px 14px}
    .btn svg{width:18px;height:18px;opacity:0.98}
    .footer{margin-top:20px;font-size:12px;color:rgba(230,238,248,0.65);display:flex;justify-content:space-between;align-items:center}
    @media (max-width:560px){
      .brand{gap:12px}
      .logo{width:50px;height:50px;font-size:18px}
      .card{padding:20px}
      .block{flex-direction:column;align-items:flex-start}
      .actions{width:100%;justify-content:stretch}
      .btn{width:100%;justify-content:center}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand">
      <div class="logo">水</div>
      <div>
        <h1>水喝千束 — 首次直播</h1>
        <p style="margin:4px 0 0;font-size:13px;color:rgba(230,238,248,0.72)">首次生日直播 敬请期待</p>
      </div>
    </div>
    <p class="lead">下面的按钮会在新标签页打开目标链接 — 点击安全无弹窗。</p>
    <section style="display:grid;gap:12px">
      <div class="block">
        <div class="left">
          <p class="title">点击查看水喝千束首次直播预告</p>
          <p class="subtitle">（将在新标签页打开）</p>
        </div>
        <div class="actions">
          <a class="btn" href="https://b23.tv/JP7LhR9" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 6L18 12L10 18V6Z" fill="white"/></svg>
            去看看
          </a>
        </div>
      </div>
      <div class="block">
        <div class="left">
          <p class="title">查看水喝千束首次直播倒计时</p>
          <p class="subtitle">点击按钮可跳转到倒计时页面</p>
        </div>
        <div class="actions">
          <a class="btn ghost" href="https://birthday-live.github.io/WaterChisato" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 7V12L15 14" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            去看看
          </a>
        </div>
      </div>
    </section>
    <div class="footer">
      <div>© 水喝千束的博客</div>
      <div style="font-size:12px;color:rgba(230,238,248,0.5)">感谢支持水喝千束</div>
    </div>
  </main>
</body>
</html>
